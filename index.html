<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf7">
  <title>What's For Dinner?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container-xl py-3" aria-label="Main navigation">
      <a class="brand d-flex align-items-center gap-3 text-decoration-none" href="#" aria-label="What's For Dinner home">
        <span class="brand-mark"><i class="bi bi-egg-fried"></i></span>
        <span><strong>What's For Dinner</strong><small>Your daily meal inspiration</small></span>
      </a>
      <div class="desktop-actions d-none d-md-flex align-items-center gap-3">
        <button class="icon-button" id="savedNav" aria-label="Show saved recipes" title="Saved recipes"><i class="bi bi-bookmark-fill"></i></button>
        <button class="icon-button" id="historyButton" aria-label="Recipe history" title="Recently seen"><i class="bi bi-clock-history"></i></button>
        <button class="icon-button" id="settingsButton" aria-label="Settings" title="Settings"><i class="bi bi-gear-fill"></i></button>
        <span class="avatar" aria-label="Profile"><i class="bi bi-person-fill"></i></span>
      </div>
      <button class="icon-button mobile-menu d-md-none" id="menuButton" aria-label="Open menu" aria-expanded="false"><i class="bi bi-list"></i></button>
    </nav>
    <div class="mobile-drawer container d-md-none" id="mobileDrawer" hidden>
      <button class="drawer-link" id="savedNavMobile"><i class="bi bi-bookmark-fill"></i> Saved recipes</button>
      <button class="drawer-link" id="historyButtonMobile"><i class="bi bi-clock-history"></i> Recently seen</button>
      <button class="drawer-link" id="settingsButtonMobile"><i class="bi bi-gear-fill"></i> Settings</button>
    </div>
  </header>

  <main class="container-xl page-wrap">
    <article class="recipe-card" aria-live="polite">
      <section class="photo-panel">
        <img id="recipeImage" class="recipe-image" src="" alt="A freshly prepared meal">
        <div class="image-shade"></div>
        <div class="rating-pill"><i class="bi bi-star-fill"></i><strong id="rating">4.8</strong><span id="reviews">(214 reviews)</span></div>
        <div class="quick-facts">
          <div class="fact"><i class="bi bi-clock-fill prep-icon"></i><span>Prep Time</span><strong id="prepTime">15 min</strong></div>
          <div class="fact"><i class="bi bi-fire cook-icon"></i><span>Cook Time</span><strong id="cookTime">20 min</strong></div>
          <div class="fact"><i class="bi bi-people-fill serving-icon"></i><span>Servings</span><strong id="servings">2 people</strong></div>
        </div>
      </section>

      <section class="recipe-content">
        <div class="recipe-heading">
          <div class="heading-copy">
            <div class="badges"><span class="badge-easy" id="difficulty">Easy</span><span class="badge-cuisine" id="cuisine">Mediterranean</span></div>
            <h1 id="recipeName">Caesar Salad</h1>
            <p id="description">Crisp greens, creamy dressing, and a little crunch.</p>
          </div>
          <div class="recipe-actions">
            <button class="action-tile" id="saveButton" aria-label="Save recipe" title="Save recipe"><i class="bi bi-bookmark-fill"></i></button>
            <button class="action-tile" id="shareButton" aria-label="Share recipe" title="Share recipe"><i class="bi bi-share-fill"></i></button>
          </div>
        </div>

        <div class="recipe-tabs" role="tablist" aria-label="Recipe details">
          <button class="recipe-tab active" role="tab" aria-selected="true" data-tab="ingredients"><i class="bi bi-list-check"></i><span>Ingredients</span></button>
          <button class="recipe-tab" role="tab" aria-selected="false" data-tab="instructions"><i class="bi bi-book-half"></i><span>Instructions</span></button>
          <button class="recipe-tab" role="tab" aria-selected="false" data-tab="nutrition"><i class="bi bi-pie-chart-fill"></i><span>Nutrition</span></button>
          <button class="recipe-tab" role="tab" aria-selected="false" data-tab="tips"><i class="bi bi-lightbulb-fill"></i><span>Chef's Tips</span></button>
        </div>
        <div class="details-box" id="detailsPanel" role="tabpanel"></div>
        <footer class="card-footer-actions">
          <button class="btn another-button" id="anotherButton"><i class="bi bi-arrow-repeat"></i> Try Another Recipe</button>
          <span class="recipe-count" id="recipeCount"></span>
        </footer>
      </section>
    </article>
  </main>

  <div class="toast-wrap" aria-live="polite" aria-atomic="true"><div class="toast-message" id="toastMessage"></div></div>
  <div class="modal-backdrop-custom" id="infoModal" hidden>
    <section class="info-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle">Saved recipes</h2><button class="icon-button close-modal" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>
      <div id="modalBody"></div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
